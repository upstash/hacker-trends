# Daily ingest of Hacker News data into Upstash Redis.
#
# Why a GitHub Action and not a Vercel cron: a backfill decodes a multi-hundred-MB
# monthly Parquet file and the daily run fetches tens of thousands of items from
# the HN API and pipelines them as HSETs, which blows past Vercel serverless
# time/memory limits. A plain runner with a full Bun runtime is the right home.
#
# Sources: the HuggingFace open-index/hacker-news monthly Parquet (stopped
# publishing on 2026-08-23; a missing current/previous month is non-fatal), and
# the official HN Firebase API, whose tail (`ingest.ts --live`) keeps the index
# current on its own: it resumes after the newest indexed item in bounded chunks
# and re-fetches the last ~3 days so scores, comment counts and deletions settle.
# HSET is idempotent (it overwrites the hn:<id> hash in place), so overlap between
# the two sources just refreshes items.
#
# The cache primes and the freshness check run even when an ingest step fails,
# so the gallery keys (30-day TTL) never lapse. Any failure opens (or comments
# on) a "Daily ingest failing" issue.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   UPSTASH_REDIS_REST_URL    same URL as the deploy
#   UPSTASH_REDIS_REST_TOKEN  a WRITABLE token

name: Ingest HN data

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch: # manual run from the Actions tab / `gh workflow run`
    inputs:
      year:
        description: "Year to ingest from HuggingFace (default: current UTC year)"
        required: false
      month:
        description: "Month to ingest from HuggingFace, 1-12 (default: current UTC month)"
        required: false

permissions:
  contents: read

# Never let two ingests overlap (a slow run + the next day's cron).
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # failure alert
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Refresh current month from HuggingFace (or the month given on a manual run)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          [ -z "$YEAR" ]  && YEAR="$(date -u +%Y)"
          [ -z "$MONTH" ] && MONTH="$(date -u +%m)"
          echo "Ingesting $YEAR-$MONTH"
          bun scripts/ingest.ts "$YEAR" "$MONTH"

      - name: Finalize the previous month at the month boundary
        # On the 1st/2nd, last month got its final authoritative rewrite at
        # 00:00 UTC (while HuggingFace still publishes); re-ingest it once so its
        # last day isn't permanently missed. Skipped on manual runs.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%d)"
          if [ "$DAY" = "01" ] || [ "$DAY" = "02" ]; then
            PY="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y)"
            PM="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%m)"
            echo "Month boundary: finalizing $PY-$PM"
            bun scripts/ingest.ts "$PY" "$PM"
          else
            echo "Not a month boundary (day $DAY); nothing to finalize."
          fi

      - name: Fill the live tail and refresh recent items from the HN API
        # Runs even if the archive steps failed: this alone keeps the index fresh.
        # Time-budgeted (~17 min max) so a large backlog drains over several runs.
        if: ${{ !cancelled() }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: bun scripts/ingest.ts --live

      - name: Refresh the dedicated hnjobs postings index (current month)
        # After the shared `hn` index has this month's items, rebuild the
        # dedicated `hnjobs` postings index for the same month so the
        # drill-down's reply counts stay current (the open "Who is hiring?" thread
        # keeps gaining postings + replies all month). ingest-jobs.ts reads the
        # postings out of `hn`, computes each posting's direct-children reply
        # count in one batched pass, and HSETs them into `hnjob:*` (idempotent).
        # Independent of the archive steps: `hn` is fed by the live tail too.
        if: ${{ !cancelled() }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          [ -z "$YEAR" ]  && YEAR="$(date -u +%Y)"
          [ -z "$MONTH" ] && MONTH="$(date -u +%m)"
          # ingest-jobs.ts addresses months as zero-padded "YYYY-MM".
          MONTH="$(printf '%02d' "$((10#$MONTH))")"
          echo "Refreshing hnjobs for $YEAR-$MONTH"
          bun scripts/ingest-jobs.ts "$YEAR-$MONTH"

      - name: Finalize hnjobs for the previous month at the month boundary
        # Same month-boundary logic as the `hn` finalize above: rebuild last
        # month's `hnjobs` slice once so its final replies are captured.
        # Schedule-only.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%d)"
          if [ "$DAY" = "01" ] || [ "$DAY" = "02" ]; then
            PYM="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
            echo "Month boundary: finalizing hnjobs for $PYM"
            bun scripts/ingest-jobs.ts "$PYM"
          else
            echo "Not a month boundary (day $DAY); nothing to finalize for hnjobs."
          fi

      - name: Prime the Who-is-hiring gallery cache
        # The deployed app NEVER computes the jobs gallery (no ~120-aggregate
        # fan-out on Vercel). It only reads the Redis
        # `jobs-gallery-wire:<version>` key, which this step rebuilds against the
        # just-refreshed index. Runs even if an ingest step failed so the key
        # (30-day TTL) never lapses. Fails the job if the build came back
        # incomplete, so a degraded gallery doesn't pass silently.
        if: ${{ !cancelled() }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: bun scripts/prime-jobs-gallery.ts --write

      - name: Prime the examples gallery cache
        # Twin of the step above for the main landing-page gallery. The deployed
        # app NEVER computes this (no 308-aggregate fan-out on Vercel); it only
        # reads the Redis `examples:<CATALOG_VERSION>` key, which this step
        # rebuilds. refresh-cache.ts only writes a complete build (a partial one
        # keeps the previous value) and exits non-zero if the build was
        # incomplete or the write didn't read back.
        if: ${{ !cancelled() }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: bun scripts/refresh-cache.ts --write

      - name: Check data freshness
        # Read-only. Fails if the newest indexed item is older than 36h, so a
        # stalled pipeline alerts even when every step above "succeeded".
        if: ${{ !cancelled() }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: bun scripts/check-freshness.ts 36

      - name: Open or update the failure issue
        # cancelled() also catches the 30-min timeout.
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Daily ingest failing"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          N="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The daily ingest run failed: $RUN_URL. Later failures are added as comments; close this once a run passes."
          fi

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repo activity.
    # Re-enabling the (already enabled) workflow via the API resets that clock.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ingest.yml/enable"
